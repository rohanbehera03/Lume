name: Build Lume DMG

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "Xcode scheme to build (leave blank to auto-detect)"
        required: false
        default: ""
      lume_ref:
        description: "Lume tag to build (blank = v3.2.0)"
        required: false
        default: ""
      recorder_ref:
        description: "LumeRecorder tag/branch (blank = default branch)"
        required: false
        default: ""
      engine_ref:
        description: "LumeEngine tag/branch (blank = default branch)"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Lume at the release tag
        uses: actions/checkout@v4
        with:
          repository: bilipp/Lume
          ref: ${{ github.event.inputs.lume_ref || 'v3.2.0' }}

      - name: Clone sibling dependencies (LumeRecorder, LumeEngine)
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/.."
          for pair in "LumeRecorder:${{ github.event.inputs.recorder_ref }}" "LumeEngine:${{ github.event.inputs.engine_ref }}" "LumeCloud:"; do
            name="${pair%%:*}"
            ref="${pair#*:}"
            if git clone "https://github.com/bilipp/$name.git" "$name"; then
              if [ -n "$ref" ]; then git -C "$name" checkout "$ref"; fi
              echo "== $name at $(git -C "$name" describe --tags --always)"
            else
              echo "::warning::Could not clone bilipp/$name (private or does not exist)"
            fi
          done
          ls -la "$GITHUB_WORKSPACE/.."
          ls "LumeRecorder" || true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Find project and scheme
        id: find
        run: |
          set -e
          if ls -d *.xcworkspace >/dev/null 2>&1; then
            CONTAINER_FLAG="-workspace $(ls -d *.xcworkspace | head -1)"
          else
            CONTAINER_FLAG="-project $(ls -d *.xcodeproj | head -1)"
          fi
          echo "container=$CONTAINER_FLAG" >> "$GITHUB_OUTPUT"

          SCHEME="${{ github.event.inputs.scheme }}"
          if [ -z "$SCHEME" ]; then
            xcodebuild -list -json $CONTAINER_FLAG > schemes.json
            cat schemes.json
            # Prefer a scheme named like the app; otherwise take the first one.
            SCHEME=$(python3 - <<'EOF'
          import json
          data = json.load(open("schemes.json"))
          info = data.get("workspace") or data.get("project")
          schemes = info.get("schemes", [])
          pick = next((s for s in schemes if s.lower() == "lume"), None) \
              or next((s for s in schemes if "lume" in s.lower() and "test" not in s.lower()
                       and "widget" not in s.lower() and "extension" not in s.lower()), None) \
              or (schemes[0] if schemes else "")
          print(pick)
          EOF
            )
          fi
          echo "Using scheme: $SCHEME"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build macOS app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            ${{ steps.find.outputs.container }} \
            -scheme "${{ steps.find.outputs.scheme }}" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 200

      - name: Create DMG
        run: |
          set -e
          APP=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "No .app found in build output"; exit 1
          fi
          echo "Found app: $APP"
          # Ad-hoc sign so it launches on Apple Silicon after the Gatekeeper override
          codesign --force --deep --sign - "$APP" || true

          mkdir -p dmg_staging
          cp -R "$APP" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create \
            -volname "Lume" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            Lume.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Lume-dmg
          path: Lume.dmg
          if-no-files-found: error
