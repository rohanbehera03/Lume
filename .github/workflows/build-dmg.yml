name: Build Lume DMG

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "Xcode scheme to build (leave blank to auto-detect)"
        required: false
        default: ""
      arch:
        description: "Architecture: x86_64 (Intel) or 'arm64 x86_64' (universal)"
        required: false
        default: "x86_64"
      swift_opt:
        description: "Swift optimization level (blank = project default; use -Onone to avoid the compiler crash)"
        required: false
        default: "-Onone"
      xcode_app:
        description: "Xcode app to use, e.g. Xcode_26.4.app (blank = runner default)"
        required: false
        default: ""
      lume_ref:
        description: "Lume tag to build (blank = v3.2.0)"
        required: false
        default: ""
      recorder_ref:
        description: "LumeRecorder tag/branch (blank = default branch)"
        required: false
        default: ""
      engine_ref:
        description: "LumeEngine tag/branch (blank = default branch)"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Lume at the release tag
        uses: actions/checkout@v4
        with:
          repository: bilipp/Lume
          ref: ${{ github.event.inputs.lume_ref || 'v3.2.0' }}

      - name: Clone sibling dependencies (LumeRecorder, LumeEngine)
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/.."
          for pair in "LumeRecorder:${{ github.event.inputs.recorder_ref }}" "LumeEngine:${{ github.event.inputs.engine_ref }}" "LumeCloud:"; do
            name="${pair%%:*}"
            ref="${pair#*:}"
            if git clone "https://github.com/bilipp/$name.git" "$name"; then
              if [ -n "$ref" ]; then git -C "$name" checkout "$ref"; fi
              echo "== $name at $(git -C "$name" describe --tags --always)"
            else
              echo "::warning::Could not clone bilipp/$name (private or does not exist)"
            fi
          done
          ls -la "$GITHUB_WORKSPACE/.."
          ls "LumeRecorder" || true

      - name: Select Xcode and show version
        run: |
          ls -d /Applications/Xcode*.app || true
          if [ -n "${{ github.event.inputs.xcode_app }}" ]; then
            sudo xcode-select -s "/Applications/${{ github.event.inputs.xcode_app }}/Contents/Developer"
          fi
          xcodebuild -version

      - name: Find project and scheme
        id: find
        run: |
          set -e
          if ls -d *.xcworkspace >/dev/null 2>&1; then
            CONTAINER_FLAG="-workspace $(ls -d *.xcworkspace | head -1)"
          else
            CONTAINER_FLAG="-project $(ls -d *.xcodeproj | head -1)"
          fi
          echo "container=$CONTAINER_FLAG" >> "$GITHUB_OUTPUT"

          SCHEME="${{ github.event.inputs.scheme }}"
          if [ -z "$SCHEME" ]; then
            xcodebuild -list -json $CONTAINER_FLAG > schemes.json
            cat schemes.json
            # Prefer a scheme named like the app; otherwise take the first one.
            SCHEME=$(python3 - <<'EOF'
          import json
          data = json.load(open("schemes.json"))
          info = data.get("workspace") or data.get("project")
          schemes = info.get("schemes", [])
          pick = next((s for s in schemes if s.lower() == "lume"), None) \
              or next((s for s in schemes if "lume" in s.lower() and "test" not in s.lower()
                       and "widget" not in s.lower() and "extension" not in s.lower()), None) \
              or (schemes[0] if schemes else "")
          print(pick)
          EOF
            )
          fi
          echo "Using scheme: $SCHEME"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Print code near the known compiler timeout
        run: |
          echo "---- SeriesDetailView.swift lines 85-150 ----"
          sed -n '85,150p' Lume/Views/Series/SeriesDetailView.swift || true

      - name: Patch SeriesDetailView (split heavy closure so the compiler can type-check it)
        run: |
          cat > /tmp/patch.py <<'PY'
          import re, sys
          path = "Lume/Views/Series/SeriesDetailView.swift"
          lines = open(path, encoding="utf-8").read().split("\n")
          head = "\n".join(lines[:84])
          tail = "\n".join(lines[84:])

          pattern = re.compile(
              r"\.task\(id: series\.id\) \{[ \t]*\n"
              r"(?P<body>.*?)"
              r"\n[ \t]*withAnimation\(\.easeInOut\(duration: 0\.3\)\) \{[ \t]*\n"
              r"[ \t]*isLoadingTMDB = false[ \t]*\n"
              r"[ \t]*\}[ \t]*\n"
              r"[ \t]*\}",
              re.DOTALL,
          )
          m = pattern.search(tail)
          if not m:
              print("PATCH FAILED: could not find the .task block", file=sys.stderr)
              sys.exit(1)

          body_lines = [l.strip() for l in m.group("body").split("\n") if l.strip()]
          method = "    private func runInitialLoad() async {\n"
          for l in body_lines:
              method += "        " + l + "\n"
          method += "        withAnimation(Animation.easeInOut(duration: 0.3)) {\n"
          method += "            isLoadingTMDB = false\n"
          method += "        }\n"
          method += "    }\n\n"

          tail = tail[:m.start()] + ".task(id: series.id) { await runInitialLoad() }" + tail[m.end():]

          marker = "    // MARK: - Loading"
          if marker not in tail:
              print("PATCH FAILED: marker not found", file=sys.stderr)
              sys.exit(1)
          tail = tail.replace(marker, method + marker, 1)

          open(path, "w", encoding="utf-8").write(head + "\n" + tail)
          print("Patched OK. New method:")
          print(method)
          PY
          python3 /tmp/patch.py
          echo "---- patched region ----"
          sed -n '85,125p' Lume/Views/Series/SeriesDetailView.swift

      - name: Patch SeriesDetailView body (split long modifier chain into stages)
        run: |
          cat > /tmp/patch2.py <<'PY'
          import sys
          path = "Lume/Views/Series/SeriesDetailView.swift"
          lines = open(path, encoding="utf-8").read().split("\n")

          def find(pred, start=0):
              for i in range(start, len(lines)):
                  if pred(lines[i].strip()):
                      return i
              return -1

          else_idx = find(lambda s: s == "#else", 60)
          group_idx = find(lambda s: s == "Group {", else_idx)
          toolbar_idx = find(lambda s: s == ".toolbar { toolbarContent }", group_idx)
          task_idx = find(lambda s: s.startswith(".task(id: series.id) { await runInitialLoad() }"), toolbar_idx)
          src_idx = find(lambda s: s.startswith(".onChange(of: sourcesKey)"), task_idx)
          pick_idx = find(lambda s: s.startswith(".contentSourcePicker("), src_idx)

          idxs = [else_idx, group_idx, toolbar_idx, task_idx, src_idx, pick_idx]
          print("indices:", idxs)
          if min(idxs) < 0 or idxs != sorted(idxs):
              print("PATCH2 FAILED: markers not found in expected order", file=sys.stderr)
              sys.exit(1)

          stage1 = lines[group_idx:toolbar_idx + 1]
          stage2 = lines[task_idx:src_idx + 1]

          new_lines = lines[:group_idx] + ["            bodyStageTwo"] + lines[pick_idx:]

          props = []
          props.append("    private var bodyStageOne: some View {")
          props += stage1
          props.append("    }")
          props.append("")
          props.append("    private var bodyStageTwo: some View {")
          props.append("        bodyStageOne")
          props += stage2
          props.append("    }")
          props.append("")

          marker = next((i for i, l in enumerate(new_lines) if l.strip() == "// MARK: - Loading"), -1)
          if marker < 0:
              print("PATCH2 FAILED: MARK marker not found", file=sys.stderr)
              sys.exit(1)
          new_lines = new_lines[:marker] + props + new_lines[marker:]

          open(path, "w", encoding="utf-8").write("\n".join(new_lines))
          print("Patch2 applied OK")
          PY
          python3 /tmp/patch2.py
          echo "---- new body ----"
          sed -n '80,110p' Lume/Views/Series/SeriesDetailView.swift
          echo "---- new stage properties ----"
          grep -n "bodyStage" Lume/Views/Series/SeriesDetailView.swift

      - name: Build macOS app (unsigned)
        run: |
          set -o pipefail
          EXTRA=()
          if [ -n "${{ github.event.inputs.swift_opt }}" ]; then
            EXTRA+=("SWIFT_OPTIMIZATION_LEVEL=${{ github.event.inputs.swift_opt }}")
          fi
          EXTRA+=("ARCHS=${{ github.event.inputs.arch || 'x86_64' }}" "ONLY_ACTIVE_ARCH=NO" "MACOSX_DEPLOYMENT_TARGET=15.0" "VALIDATE_PRODUCT=NO")
          echo "Extra build settings: ${EXTRA[*]}"
          xcodebuild build \
            "${EXTRA[@]}" \
            ${{ steps.find.outputs.container }} \
            -scheme "${{ steps.find.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CLANG_ENABLE_CODE_COVERAGE=NO \
            CLANG_COVERAGE_MAPPING=NO \
            SWIFT_COMPILATION_MODE=wholemodule \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | tail -n 40

      - name: Show errors only
        if: failure()
        run: |
          echo "==== log size ===="
          wc -l build.log || echo "build.log missing (an earlier step failed before the build ran)"
          echo "==== error lines ===="
          grep -n -E " error:|error: |Undefined symbols|^ld: |fatal error|BUILD FAILED|Command .* failed|Could not resolve|The following build commands failed" build.log | grep -v "warning:" | head -60 || true
          echo "==== last 60 lines of build.log ===="
          tail -n 60 build.log | cut -c1-300 || true
          echo "==== context around first error ===="
          first=$(grep -n "error:" build.log | head -1 | cut -d: -f1)
          if [ -n "$first" ]; then
            start=$((first-5)); [ $start -lt 1 ] && start=1
            sed -n "${start},$((first+15))p" build.log
          fi

      - name: Create DMG
        run: |
          set -e
          APP=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "No .app found in build output"; exit 1
          fi
          echo "Found app: $APP"

          echo "Structure of Libavformat.framework (diagnostic):"
          ls -laR "$APP/Contents/Frameworks/Libavformat.framework" 2>/dev/null | head -40 || true

          echo "Adding a minimal Info.plist to embedded frameworks that lack one:"
          for fw in "$APP"/Contents/Frameworks/*.framework; do
            [ -d "$fw" ] || continue
            name=$(basename "$fw" .framework)
            if [ -d "$fw/Versions/A" ]; then
              [ -e "$fw/Versions/Current" ] || ln -sfn A "$fw/Versions/Current"
              plist_dir="$fw/Versions/A/Resources"
            else
              plist_dir="$fw"
            fi
            if [ ! -f "$plist_dir/Info.plist" ] && [ ! -f "$fw/Resources/Info.plist" ]; then
              echo "  adding Info.plist to $name"
              mkdir -p "$plist_dir"
              printf '%s\n' \
                '<?xml version="1.0" encoding="UTF-8"?>' \
                '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
                '<plist version="1.0"><dict>' \
                "<key>CFBundleExecutable</key><string>$name</string>" \
                "<key>CFBundleIdentifier</key><string>com.local.$name</string>" \
                "<key>CFBundleName</key><string>$name</string>" \
                '<key>CFBundlePackageType</key><string>FMWK</string>' \
                '<key>CFBundleShortVersionString</key><string>1.0</string>' \
                '<key>CFBundleVersion</key><string>1</string>' \
                '</dict></plist>' > "$plist_dir/Info.plist"
              if [ -d "$fw/Versions/A" ] && [ ! -e "$fw/Resources" ]; then
                ln -sfn Versions/Current/Resources "$fw/Resources"
              fi
            fi
          done
          echo "Architectures in app binary:"
          for f in "$APP"/Contents/MacOS/*; do echo "$f: $(lipo -archs "$f" 2>&1)"; done

          echo "Minimum macOS version required (want 15.0 or lower):"
          minos_of() { vtool -show-build "$1" 2>/dev/null | awk '/minos/ {print $2}' | sort -V | tail -1; }
          too_new() { [ "$(printf '%s\n15.0\n' "$1" | sort -V | tail -1)" != "15.0" ]; }
          main_bad=0
          for f in "$APP"/Contents/MacOS/*; do
            m=$(minos_of "$f")
            echo "  main binary: ${m:-unknown}  $f"
            if [ -n "$m" ] && too_new "$m"; then main_bad=1; fi
          done
          find "$APP/Contents/Frameworks" -type f 2>/dev/null | while read -r f; do
            if file "$f" | grep -q "Mach-O"; then
              m=$(minos_of "$f")
              if [ -n "$m" ]; then
                echo "  ${m}  ${f#$APP/}"
                if too_new "$m"; then echo "::warning::requires macOS $m: ${f#$APP/}"; fi
              fi
            fi
          done
          if [ "$main_bad" = "1" ]; then
            echo "::error::Main app binary requires newer than macOS 15.0"; exit 1
          fi
          # Ad-hoc sign so it launches on Apple Silicon after the Gatekeeper override
          codesign --force --deep --sign - "$APP" || true

          mkdir -p dmg_staging
          cp -R "$APP" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create \
            -volname "Lume" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            Lume.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Lume-dmg
          path: Lume.dmg
          if-no-files-found: error
